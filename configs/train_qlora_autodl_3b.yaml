### AutoDL fallback: RTX 4090 24GB, Qwen2.5-3B-Instruct.
### Use this if Kaggle phone verification cannot be completed.

model_name_or_path: /root/autodl-tmp/models/Qwen2.5-3B-Instruct
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

quantization_bit: 4
quantization_method: bnb
double_quantization: true

dataset_dir: /root/autodl-tmp/mas/data
dataset: toolcall_sft
template: qwen
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8

output_dir: /root/autodl-tmp/output/mas-qwen25-3b-toolcall-lora
logging_steps: 10
save_steps: 100
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05

# 4090 supports bf16.
bf16: true
fp16: false
gradient_checkpointing: true
optim: paged_adamw_8bit

do_eval: true
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
