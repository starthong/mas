### Kaggle T4 config for Qwen2.5-3B-Instruct.
### 7B also works, but 3B is safer on a 16GB T4 and leaves room for eval.

model_name_or_path: /kaggle/temp/models/Qwen2.5-3B-Instruct
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

quantization_bit: 4
quantization_method: bnb
double_quantization: true

dataset_dir: /kaggle/working/mas/data
dataset: toolcall_sft
template: qwen
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 2

output_dir: /kaggle/working/output/qwen25-3b-toolcall-lora
logging_steps: 10
save_steps: 100
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05

# T4 (Turing) does not support bf16.
fp16: true
bf16: false
gradient_checkpointing: true
optim: paged_adamw_8bit

do_eval: true
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
